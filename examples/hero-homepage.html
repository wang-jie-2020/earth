<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>系统首页 Hero 原型</title>
    <style>
      :root {
        --bg-0: #040913;
        --bg-1: #07162d;
        --bg-2: #0b2748;
        --text-main: #e7f2ff;
        --text-muted: #98acc7;
        --card-bg: rgba(5, 18, 37, 0.62);
        --card-border: rgba(104, 180, 255, 0.28);
        --accent: #87f8ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: var(--text-main);
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: linear-gradient(135deg, var(--bg-0), var(--bg-1) 48%, var(--bg-2));
      }

      .hero {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-width: 1200px;
        overflow: hidden;
      }

      #globe-stage {
        position: absolute;
        inset: 0;
        animation: stage-enter 1.2s cubic-bezier(0.17, 0.67, 0.31, 1) both;
      }

      .hero-cards {
        position: absolute;
        top: 28px;
        left: 36px;
        right: 36px;
        z-index: 10;
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(4, minmax(190px, 1fr));
        pointer-events: none;
      }

      .hero-card {
        border: 1px solid var(--card-border);
        border-radius: 8px;
        background: linear-gradient(165deg, rgba(8, 24, 50, 0.72), var(--card-bg));
        box-shadow: inset 0 1px 0 rgba(181, 220, 255, 0.12), 0 10px 32px rgba(1, 7, 19, 0.45);
        backdrop-filter: blur(8px);
        padding: 14px 16px;
        min-height: 106px;
        opacity: 0;
        transform: translateY(-10px);
        animation: card-enter 0.7s ease forwards;
      }

      .hero-card:nth-child(1) {
        animation-delay: 0.2s;
      }
      .hero-card:nth-child(2) {
        animation-delay: 0.35s;
      }
      .hero-card:nth-child(3) {
        animation-delay: 0.5s;
      }
      .hero-card:nth-child(4) {
        animation-delay: 0.65s;
      }

      .hero-card .label {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      .hero-card .value {
        margin: 8px 0 7px;
        font-size: 32px;
        line-height: 1;
        font-weight: 600;
        color: var(--accent);
        text-shadow: 0 0 24px rgba(97, 193, 255, 0.3);
      }

      .hero-card .desc {
        margin: 0;
        font-size: 12px;
        color: var(--text-muted);
      }

      .legend {
        position: absolute;
        left: 36px;
        bottom: 26px;
        z-index: 8;
        display: flex;
        gap: 18px;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid rgba(104, 180, 255, 0.2);
        background: rgba(4, 14, 30, 0.55);
        backdrop-filter: blur(6px);
        font-size: 12px;
        color: var(--text-muted);
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        box-shadow: 0 0 10px currentColor;
      }

      .tooltip {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        z-index: 30;
        border-radius: 8px;
        border: 1px solid rgba(98, 184, 255, 0.5);
        background: rgba(7, 21, 41, 0.92);
        box-shadow: 0 16px 48px rgba(0, 8, 19, 0.56);
        padding: 12px 14px;
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -118%) scale(0.96);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .tooltip.show {
        opacity: 1;
        transform: translate(-50%, -126%) scale(1);
      }

      .tooltip .name {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #87f8ff;
      }

      .tooltip .meta {
        margin: 5px 0 10px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .tooltip .tag {
        display: inline-block;
        margin-bottom: 8px;
        border-radius: 999px;
        padding: 3px 8px;
        background: rgba(92, 174, 255, 0.16);
        color: #b8e6ff;
        font-size: 11px;
      }

      .tooltip .content {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #d6e7ff;
      }

      @keyframes card-enter {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes stage-enter {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <section id="globe-stage"></section>

      <section class="hero-cards" aria-label="全局项目概览">
        <article class="hero-card">
          <p class="label">Project Count</p>
          <p class="value" id="metric-total">0</p>
          <p class="desc">全球在管项目总量</p>
        </article>
        <article class="hero-card">
          <p class="label">Coverage</p>
          <p class="value" id="metric-regions">0</p>
          <p class="desc">覆盖国家与地区</p>
        </article>
        <article class="hero-card">
          <p class="label">Delivery Rate</p>
          <p class="value" id="metric-active">0%</p>
          <p class="desc">本月正常履约率</p>
        </article>
        <article class="hero-card">
          <p class="label">Risk Alerts</p>
          <p class="value" id="metric-risk">0</p>
          <p class="desc">需跟进风险项目</p>
        </article>
      </section>

      <aside class="legend" aria-label="点位状态图例">
        <span class="legend-item"><span class="legend-dot" style="color:#53beff;background:#53beff;"></span>建设中</span>
        <span class="legend-item"><span class="legend-dot" style="color:#52efd6;background:#52efd6;"></span>稳定运营</span>
        <span class="legend-item"><span class="legend-dot" style="color:#ff6a78;background:#ff6a78;"></span>风险观察</span>
      </aside>

      <article id="project-tooltip" class="tooltip" aria-live="polite">
        <h2 class="name" id="tip-name"></h2>
        <p class="meta" id="tip-meta"></p>
        <span class="tag" id="tip-type"></span>
        <p class="content" id="tip-desc"></p>
      </article>
    </main>

    <script>
      const METRICS = {
        totalProjects: "128",
        coverageRegions: "7",
        deliveryRate: "91%",
        riskCount: "12",
      };

      document.getElementById("metric-total").textContent = METRICS.totalProjects;
      document.getElementById("metric-regions").textContent = METRICS.coverageRegions;
      document.getElementById("metric-active").textContent = METRICS.deliveryRate;
      document.getElementById("metric-risk").textContent = METRICS.riskCount;
    </script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.184.0/build/three.webgpu.js",
          "three/webgpu": "https://unpkg.com/three@0.184.0/build/three.webgpu.js",
          "three/tsl": "https://unpkg.com/three@0.184.0/build/three.tsl.js",
          "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three/webgpu";
      import {
        step,
        normalWorldGeometry,
        output,
        texture,
        vec3,
        vec4,
        normalize,
        positionWorld,
        bumpMap,
        cameraPosition,
        color,
        uniform,
        mix,
        uv,
        max,
      } from "three/tsl";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const PROJECTS = [
        {
          name: "巴西圣保罗配网升级",
          country: "巴西",
          region: "南美",
          lat: -23.55,
          lon: -46.63,
          type: "配网工程",
          desc: "城市环网改造与配电自动化升级，覆盖 8 个核心城区。",
          status: "building",
        },
        {
          name: "德国鲁尔工业园储能",
          country: "德国",
          region: "欧洲",
          lat: 51.45,
          lon: 7.01,
          type: "储能系统",
          desc: "工商业储能与微网调度，服务制造业峰谷平衡。",
          status: "active",
        },
        {
          name: "埃及苏伊士港口微网",
          country: "埃及",
          region: "非洲",
          lat: 29.97,
          lon: 32.55,
          type: "微电网",
          desc: "港口岸电与柴油替代工程，提升高峰保供稳定性。",
          status: "building",
        },
        {
          name: "阿联酋沙漠光伏矩阵",
          country: "阿联酋",
          region: "中东",
          lat: 24.45,
          lon: 54.38,
          type: "光伏电站",
          desc: "2.4GW 地面电站建设中，含高温沙尘工况治理方案。",
          status: "watch",
        },
        {
          name: "印度孟买智慧调度中心",
          country: "印度",
          region: "南亚",
          lat: 19.07,
          lon: 72.88,
          type: "调度系统",
          desc: "统一调度平台与告警联动体系，支持多区域协同处置。",
          status: "active",
        },
        {
          name: "澳大利亚珀斯矿区供电",
          country: "澳大利亚",
          region: "大洋洲",
          lat: -31.95,
          lon: 115.86,
          type: "工业供电",
          desc: "矿区多点离网供电系统，重点保障极端天气韧性。",
          status: "watch",
        },
      ];

      const STATUS_STYLE = {
        building: { color: 0x53beff, label: "建设中" },
        active: { color: 0x52efd6, label: "稳定运营" },
        watch: { color: 0xff6a78, label: "风险观察" },
      };

      const stage = document.getElementById("globe-stage");
      const tooltipEl = document.getElementById("project-tooltip");
      const tipNameEl = document.getElementById("tip-name");
      const tipMetaEl = document.getElementById("tip-meta");
      const tipTypeEl = document.getElementById("tip-type");
      const tipDescEl = document.getElementById("tip-desc");

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2(10, 10);
      const projected = new THREE.Vector3();
      const worldPoint = new THREE.Vector3();
      const pointToCamera = new THREE.Vector3();
      const pointNormal = new THREE.Vector3();

      const markerEntries = [];
      const markerCores = [];

      let camera;
      let scene;
      let renderer;
      let controls;
      let timer;
      let earthRoot;
      let globe;
      let atmosphere;
      let globeMaterial;

      let hoveredEntry = null;
      let needsPickUpdate = false;
      let elapsedTime = 0;
      let pointerDown = null;
      let textureLoadFailed = false;
      let fallbackApplied = false;

      init();

      function init() {
        timer = new THREE.Timer();
        timer.connect(document);

        camera = new THREE.PerspectiveCamera(25, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4.5, 2, 3);

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const sun = new THREE.DirectionalLight("#ffffff", 2);
        sun.position.set(0, 0, 3);
        scene.add(sun);

        earthRoot = new THREE.Group();
        scene.add(earthRoot);

        const atmosphereDayColor = uniform(color("#4db2ff"));
        const atmosphereTwilightColor = uniform(color("#bc490b"));
        const roughnessLow = uniform(0.25);
        const roughnessHigh = uniform(0.35);

        const textureLoader = new THREE.TextureLoader();

        const onTextureError = () => {
          textureLoadFailed = true;
        };

        const dayTexture = textureLoader.load(
          "https://threejs.org/examples/textures/planets/earth_day_4096.jpg",
          undefined,
          undefined,
          onTextureError,
        );
        dayTexture.colorSpace = THREE.SRGBColorSpace;
        dayTexture.anisotropy = 8;

        const nightTexture = textureLoader.load(
          "https://threejs.org/examples/textures/planets/earth_night_4096.jpg",
          undefined,
          undefined,
          onTextureError,
        );
        nightTexture.colorSpace = THREE.SRGBColorSpace;
        nightTexture.anisotropy = 8;

        const bumpRoughnessCloudsTexture = textureLoader.load(
          "https://threejs.org/examples/textures/planets/earth_bump_roughness_clouds_4096.jpg",
          undefined,
          undefined,
          onTextureError,
        );
        bumpRoughnessCloudsTexture.anisotropy = 8;

        const viewDirection = positionWorld.sub(cameraPosition).normalize();
        const fresnel = viewDirection.dot(normalWorldGeometry).abs().oneMinus().toVar();
        const sunOrientation = normalWorldGeometry.dot(normalize(sun.position)).toVar();
        const atmosphereColor = mix(atmosphereTwilightColor, atmosphereDayColor, sunOrientation.smoothstep(-0.25, 0.75));

        globeMaterial = new THREE.MeshStandardNodeMaterial({ transparent: true, opacity: 0 });
        const cloudsStrength = texture(bumpRoughnessCloudsTexture, uv()).b.smoothstep(0.2, 1);

        globeMaterial.colorNode = mix(texture(dayTexture), vec3(1), cloudsStrength.mul(2));

        const roughness = max(texture(bumpRoughnessCloudsTexture).g, step(0.01, cloudsStrength));
        globeMaterial.roughnessNode = roughness.remap(0, 1, roughnessLow, roughnessHigh);

        const night = texture(nightTexture);
        const dayStrength = sunOrientation.smoothstep(-0.25, 0.5);
        const atmosphereDayStrength = sunOrientation.smoothstep(-0.5, 1);
        const atmosphereMix = atmosphereDayStrength.mul(fresnel.pow(2)).clamp(0, 1);

        let finalOutput = mix(night.rgb, output.rgb, dayStrength);
        finalOutput = mix(finalOutput, atmosphereColor, atmosphereMix);
        globeMaterial.outputNode = vec4(finalOutput, output.a);

        const bumpElevation = max(texture(bumpRoughnessCloudsTexture).r, cloudsStrength);
        globeMaterial.normalNode = bumpMap(bumpElevation);

        const globeRadius = 1.22;
        const sphereGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
        globe = new THREE.Mesh(sphereGeometry, globeMaterial);
        earthRoot.add(globe);

        const atmosphereMaterial = new THREE.MeshBasicNodeMaterial({ side: THREE.BackSide, transparent: true, opacity: 0 });
        let alpha = fresnel.remap(0.73, 1, 1, 0).pow(3);
        alpha = alpha.mul(sunOrientation.smoothstep(-0.5, 1));
        atmosphereMaterial.outputNode = vec4(atmosphereColor, alpha);

        atmosphere = new THREE.Mesh(sphereGeometry, atmosphereMaterial);
        atmosphere.scale.setScalar(1.04);
        earthRoot.add(atmosphere);

        createMarkers(globeRadius);

        renderer = new THREE.WebGPURenderer();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setAnimationLoop(animate);
        stage.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enablePan = false;
        controls.minDistance = 3.8;
        controls.maxDistance = 8;
        controls.minPolarAngle = 0.75;
        controls.maxPolarAngle = 2.35;

        renderer.domElement.addEventListener("pointermove", onPointerMove);
        renderer.domElement.addEventListener("pointerleave", onPointerLeave);
        renderer.domElement.addEventListener("pointerdown", onPointerDown);
        renderer.domElement.addEventListener("pointerup", onPointerUp);
        window.addEventListener("resize", onWindowResize);
      }

      function createMarkers(globeRadius) {
        const coreGeometry = new THREE.SphereGeometry(0.018, 16, 16);

        PROJECTS.forEach((project, index) => {
          const style = STATUS_STYLE[project.status];
          const markerPos = latLonToVector3(project.lat, project.lon, globeRadius * 1.02);

          const core = new THREE.Mesh(
            coreGeometry,
            new THREE.MeshBasicMaterial({ color: style.color, transparent: true, opacity: 0 }),
          );
          core.position.copy(markerPos);

          const entry = {
            project,
            style,
            core,
            delay: 0.35 + index * 0.1,
            pulseOffset: Math.random() * Math.PI * 2,
          };

          core.userData.entry = entry;
          markerEntries.push(entry);
          markerCores.push(core);
          earthRoot.add(core);
        });
      }

      function latLonToVector3(lat, lon, radius) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);
        return new THREE.Vector3(
          -(radius * Math.sin(phi) * Math.cos(theta)),
          radius * Math.cos(phi),
          radius * Math.sin(phi) * Math.sin(theta),
        );
      }

      function onPointerDown(event) {
        pointerDown = { x: event.clientX, y: event.clientY };
      }

      function onPointerMove(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        needsPickUpdate = true;
      }

      function onPointerLeave() {
        pointer.set(10, 10);
        hoveredEntry = null;
        tooltipEl.classList.remove("show");
        renderer.domElement.style.cursor = "default";
        needsPickUpdate = true;
      }

      function onPointerUp(event) {
        const moved = pointerDown ? Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y) > 4 : false;
        pointerDown = null;
        updatePicking();

        if (moved) {
          return;
        }

        if (hoveredEntry) {
          openProjectDetail(hoveredEntry.project, hoveredEntry.style.label);
          return;
        }

        tooltipEl.classList.remove("show");
      }

      function showTooltip(project, statusLabel) {
        tipNameEl.textContent = project.name;
        tipMetaEl.textContent = `${project.country} · ${project.region}`;
        tipTypeEl.textContent = `${project.type} · ${statusLabel}`;
        tipDescEl.textContent = project.desc;
        tooltipEl.classList.add("show");
      }

      function updatePicking() {
        if (!needsPickUpdate) {
          return;
        }

        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(markerCores, false);
        const nextHovered = hits.length ? hits[0].object.userData.entry : null;

        if (nextHovered !== hoveredEntry) {
          hoveredEntry = nextHovered;
          if (hoveredEntry) {
            showTooltip(hoveredEntry.project, hoveredEntry.style.label);
          } else {
            tooltipEl.classList.remove("show");
          }
        }

        renderer.domElement.style.cursor = hoveredEntry ? "pointer" : "default";
        needsPickUpdate = false;
      }

      function updateTooltipPosition() {
        if (!hoveredEntry || !tooltipEl.classList.contains("show")) {
          return;
        }

        hoveredEntry.core.getWorldPosition(worldPoint);
        projected.copy(worldPoint).project(camera);
        pointToCamera.copy(camera.position).sub(worldPoint).normalize();
        pointNormal.copy(worldPoint).normalize();
        const isFacingCamera = pointToCamera.dot(pointNormal) > 0;

        if (!isFacingCamera || projected.z > 1.0) {
          tooltipEl.style.opacity = "0";
          return;
        }

        const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;

        tooltipEl.style.left = `${x}px`;
        tooltipEl.style.top = `${y}px`;
        tooltipEl.style.opacity = "1";
      }

      function openProjectDetail(project, statusLabel) {
        const params = new URLSearchParams({
          name: project.name,
          country: project.country,
          region: project.region,
          lat: String(project.lat),
          lon: String(project.lon),
          type: project.type,
          desc: project.desc,
          status: statusLabel,
        });
        window.open(`./project-detail.html?${params.toString()}`, "_blank", "noopener");
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function applyTextureFallbackIfNeeded() {
        if (!textureLoadFailed || fallbackApplied) {
          return;
        }

        globe.material = new THREE.MeshStandardMaterial({
          color: 0x0f2848,
          emissive: 0x091624,
          emissiveIntensity: 0.25,
          roughness: 0.78,
          metalness: 0.08,
          transparent: true,
          opacity: globeMaterial.opacity,
        });
        fallbackApplied = true;
      }

      function animate() {
        timer.update();
        const delta = timer.getDelta();
        elapsedTime += delta;

        const intro = Math.min(1, elapsedTime / 1.7);
        const introEase = 1 - Math.pow(1 - intro, 3);

        globeMaterial.opacity = introEase;
        atmosphere.material.opacity = 0.95 * introEase;
        earthRoot.scale.setScalar(0.96 + introEase * 0.04);

        earthRoot.rotation.y += delta * 0.025;
        globe.rotation.y += delta * 0.005;
        atmosphere.rotation.y += delta * 0.006;

        applyTextureFallbackIfNeeded();
        updatePicking();

        markerEntries.forEach((entry) => {
          const appear = THREE.MathUtils.clamp((elapsedTime - entry.delay) / 0.75, 0, 1);
          const pulse = 0.5 + 0.5 * Math.sin(elapsedTime * 2.7 + entry.pulseOffset);
          const isHover = entry === hoveredEntry;
          const baseScale = isHover ? 1.14 : 0.78 + pulse * 0.2;
          const baseOpacity = isHover ? 0.92 : 0.44 + pulse * 0.42;

          entry.core.material.color.set(isHover ? 0xffffff : entry.style.color);
          entry.core.material.opacity = baseOpacity * appear;
          entry.core.scale.setScalar(baseScale);
        });

        updateTooltipPosition();
        controls.update();
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
