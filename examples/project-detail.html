<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目详情</title>
    <style>
      :root {
        --bg-0: #071427;
        --bg-1: #0a1f3b;
        --card: rgba(10, 24, 45, 0.72);
        --line: rgba(104, 180, 255, 0.32);
        --text-main: #e6f2ff;
        --text-muted: #9bb3cf;
        --accent: #8be9ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text-main);
        background:
          radial-gradient(circle at 15% 20%, rgba(92, 170, 255, 0.2), transparent 35%),
          linear-gradient(135deg, var(--bg-0), var(--bg-1));
      }

      .page {
        width: min(920px, 92vw);
        margin: 40px auto;
      }

      .title {
        margin: 0 0 8px;
        font-size: 32px;
        color: var(--accent);
      }

      .subtitle {
        margin: 0 0 20px;
        color: var(--text-muted);
        font-size: 14px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 16px 48px rgba(1, 7, 19, 0.45);
        padding: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 10px 14px;
        align-items: start;
      }

      .label {
        color: var(--text-muted);
        font-size: 13px;
      }

      .value {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 id="name" class="title">项目详情</h1>
      <p class="subtitle">由首页点位点击唤出</p>

      <section class="card">
        <div class="grid">
          <div class="label">国家/地区</div>
          <p id="countryRegion" class="value">-</p>

          <div class="label">项目类型</div>
          <p id="type" class="value">-</p>

          <div class="label">状态</div>
          <p id="status" class="value">-</p>

          <div class="label">经纬度</div>
          <p id="coords" class="value">-</p>

          <div class="label">项目描述</div>
          <p id="desc" class="value">-</p>
        </div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const data = {
        name: params.get("name") || "项目详情",
        country: params.get("country") || "-",
        region: params.get("region") || "-",
        type: params.get("type") || "-",
        status: params.get("status") || "-",
        lat: params.get("lat") || "-",
        lon: params.get("lon") || "-",
        desc: params.get("desc") || "-",
      };

      document.title = `${data.name} - 项目详情`;
      document.getElementById("name").textContent = data.name;
      document.getElementById("countryRegion").textContent = `${data.country} · ${data.region}`;
      document.getElementById("type").textContent = data.type;
      document.getElementById("status").textContent = data.status;
      document.getElementById("coords").textContent = `${data.lat}, ${data.lon}`;
      document.getElementById("desc").textContent = data.desc;
    </script>
  </body>
</html>
